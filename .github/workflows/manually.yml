on:
  workflow_dispatch:
    inputs:
      test_inputs:
        description: 'Test inputs'
        default: 'Test asd'
jobs:
  test-inputs:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "$TEST"
          echo "${{ inputs.test_inputs }}"
        env:
          TEST: ${{ inputs.test_inputs }}

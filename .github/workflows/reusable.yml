# This is a basic workflow to help you get started with Actions

name: Reusable workflow

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  workflow_call: 
    inputs:
        test-input:
          type: string
          default: "ble"
    outputs:
        test-var:         # ← DODAJ TO!
          value: ${{ jobs.build.outputs.testvar }}

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    outputs:
      testvar: ${{ steps.ble.outputs.message }}  # message z GITHUB_OUTPUT   
      
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@v4  # REQUIRED first []
      # Runs a single command using the runners shell
      - name: Run a one-line script
        id: ble
        run: |
          echo "::notice:: Hello, ${{ inputs.test-input }}!"     # Annotation format
          echo "message=Test" >> $GITHUB_OUTPUT
      - name: test variable
        id: test-var
        run: echo "MY_VAR=hello" >> "$GITHUB_ENV"
      - name: print var
        run: echo "print var $MY_VAR"

  useoutput:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: echo "${{ needs.build.outputs.testvar }}"
      - name: print var
        run: echo "print var $MY_VAR"
      - continue-on-error: true
        name: test is var ok
        run: echo "you change vm and var is invisible. but this work"
